name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install integration and shell test dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends \
            openssh-server rsync zsh

      - name: Sync locked development environment
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --group dev

      - name: Test
        env:
          COVERAGE_FILE: ${{ runner.temp }}/dt-coverage
          DT_REQUIRE_RELAY_E2E: "1"
          TZ: UTC
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          set +e
          coverage_args=()
          if [[ "$UV_PYTHON" == "3.11" ]]; then
            coverage_args+=(
              --cov=dt
              --cov-branch
              --cov-report=term-missing:skip-covered
            )
          fi
          env -u FORCE_COLOR uv run --no-sync pytest -q --tb=short \
            -p no:cacheprovider \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            "${coverage_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/dt-pytest.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            failure_tail="$(
              tail -c 2800 "$RUNNER_TEMP/dt-pytest.log" |
                awk '{
                  gsub(/%/, "%25")
                  gsub(/\r/, "%0D")
                  printf "%s%s", (NR > 1 ? "%0A" : ""), $0
                } END { print "" }'
            )"
            echo "::error title=pytest failure::$failure_tail"
          fi
          exit "$test_status"

      - name: Static checks
        if: matrix.python-version == '3.11'
        run: |
          uv run --no-sync python scripts/docs.py
          uv run --no-sync python scripts/repo_hygiene.py
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy --strict --no-incremental \
            --cache-dir=/tmp/dt-mypy \
            --follow-imports=skip \
            src/dt scripts/audit_release.py \
            scripts/benchmark_control_plane.py \
            scripts/benchmark_remote_plane.py scripts/docs.py \
            scripts/release_contract.py scripts/repo_hygiene.py
          bash -n src/dt/payload/*.sh bootstrap.sh scripts/deploy.sh \
            install.sh scripts/package-check.sh scripts/release-check.sh \
            scripts/security-check.sh
          git diff --check

      - name: Build and install package artifacts
        env:
          DT_PACKAGE_PYTHON: "${{ matrix.python-version }}"
          DT_PACKAGE_SKIP_SYNC: "1"
          TZ: UTC
        run: env -u FORCE_COLOR scripts/package-check.sh

  security:
    name: Security
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Audit source and runtime dependencies
        run: scripts/security-check.sh
