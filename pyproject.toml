[project]
name = "disttrainer"
version = "0.6.2"
description = "DistTrainer: cross-center GPU experiment dispatcher for shared servers"
readme = "PACKAGE_README.md"
requires-python = ">=3.10,<3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["gpu", "experiments", "scheduler", "ssh", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "pyyaml>=6.0,<7",
]

[project.scripts]
dt = "dt.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "PACKAGE_README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "SUPPORT.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.ruff]
extend-exclude = [".logs", "results"]

[tool.ruff.lint]
# Keep the lint contract stable across Ruff releases. New rule families are
# adopted deliberately instead of changing implicitly on dependency updates.
select = ["E4", "E7", "E9", "F"]
