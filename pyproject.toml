[project]
name = "disttrainer"
version = "0.10.0"
description = "dt: AI-native SSH execution control plane for idle remote compute"
readme = "docs/package-readme.md"
requires-python = ">=3.10,<3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["gpu", "experiments", "scheduler", "ssh", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "pyyaml>=6.0,<7",
]

[project.scripts]
dt = "dt.entrypoint:main"

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "docs/package-readme.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.ruff]
extend-exclude = [".logs", "results"]

[tool.ruff.lint]
# Keep the lint contract stable across Ruff releases. New rule families are
# adopted deliberately instead of changing implicitly on dependency updates.
select = ["E4", "E7", "E9", "F", "B023", "PIE810", "RUF012", "RUF200"]

[tool.coverage.run]
branch = true
source = ["dt"]

[tool.coverage.report]
# The measured Python 3.11 baseline is 79.85% across statements and branches.
# Keep a platform margin while making any material regression fail CI. Raise
# this ratchet only with focused behavioral tests, never exclusions for ordinary
# production paths.
fail_under = 79
precision = 2
show_missing = true
skip_covered = true
